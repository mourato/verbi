# Copy to .github/workflows/ai.yml in each project repo.
name: ai

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  auto-review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: mourato/repo-ci/.github/workflows/opencode-review.yml@main
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

  claude:
    if: >-
      github.event_name != 'pull_request' &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '@claude')
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: mourato/repo-ci/.github/workflows/claude-mention.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
